# Built-in tier preset "mirror" (the default): same tier and same effort on every provider.
#
# The preset name is the file name. A preset only does what is written here; nothing hides
# behind the name. Activate another with `mappings.preset: <name>` in config.yaml.
#
#   effort_shift         effort levels to shift when delegating (0 = none; negative = cheaper).
#                        The result is clamped to the effort scale (low..high).
#   tier_by_task_type    optional task type -> tier override, e.g. { test: fast }.
#                        Empty = the tier requested by the host is kept for every task type.
version: 1
preset:
  description: Same tier, same effort.
  effort_shift: 0
  tier_by_task_type: {}
